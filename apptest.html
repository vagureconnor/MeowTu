<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>喵图 MeowTu</title>
<link rel="icon" href="meowtu-logo-final.png">
<style>
  html,body{margin:0;height:100%;background:#1e1e1e;}
  header{padding:8px 12px;background:#2b2b2b;border-bottom:1px solid #3d3d3d;}
  header img{height:32px;width:auto;display:block;}
  #app{position:absolute;top:49px;bottom:0;left:0;right:0;}
</style>
<script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
</head>
<body>
<header>
  <img src="meowtu-logo-final.png" alt="MeowTu">
</header>
<div id="app"></div>
<script type="module">
  await cheerpjInit({ version: 17 });
  cheerpjCreateDisplay(-1, -1, document.getElementById('app'));
  await cheerpjRunJar("/app/MeowTu/meowtu.jar");
</script>
</body>
</html>
