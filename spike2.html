<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>CheerpJ 试跑2 · 子路径修正版</title>
<script src="https://cjrtnc.leaningtech.com/5.0/loader.js"></script>
</head>
<body style="background:#1e1e1e;color:#ddd;font-family:sans-serif;">
<p>CheerpJ 试跑页2：JAR 路径带仓库子目录 /app/MeowTu/hello.jar，应弹出 Swing 小窗口。</p>
<div id="st">状态：初始化中……</div>
<script type="module">
  const st = document.getElementById('st');
  try {
    await cheerpjInit({ version: 17 });
    st.textContent = '状态：运行时就绪，启动 JAR……';
    await cheerpjRunJar("/app/MeowTu/hello.jar");
    st.textContent = '状态：JAR 已启动（窗口应已出现）。';
  } catch (e) {
    st.textContent = '状态：出错 - ' + e;
  }
</script>
</body>
</html>
